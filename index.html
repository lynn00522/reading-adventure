
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading Adventure V4</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef6ff;
  color: #284766;
  text-align: center;
  line-height: 1.6;
}

header {
  background: #dceeff;
  padding: 25px 15px;
}

h1 { margin: 0; font-size: 36px; }

main {
  max-width: 1000px;
  margin: 30px auto;
  padding: 15px;
}

.panel {
  background: white;
  border-radius: 22px;
  padding: 28px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px #00000010;
}

.menu {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

button {
  font: inherit;
  font-size: 20px;
  padding: 14px 20px;
  margin: 6px;
  border: 2px solid #a8cdf3;
  border-radius: 15px;
  background: #dfeeff;
  color: #284766;
  cursor: pointer;
  min-height: 55px;
}

button:hover { background: #c6e2ff; }

button:focus-visible {
  outline: 4px solid #ffb347;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.menu button {
  min-height: 105px;
}

.hidden { display: none; }

.options {
  margin: 20px 0;
}

.options button {
  min-width: 75px;
  font-size: 25px;
}

.feedback {
  min-height: 45px;
  font-size: 21px;
  font-weight: bold;
}

.progress {
  color: #55718b;
}

.stars {
  color: #996400;
  font-size: 22px;
}

.word-box {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 20px 0;
}

.tile {
  min-width: 65px;
  padding: 12px;
  border: 2px solid #a8cdf3;
  border-radius: 12px;
  background: #eef6ff;
  font-size: 30px;
}

.sentence {
  font-size: 29px;
  line-height: 2;
  padding: 20px;
  background: #f1f8ff;
  border-radius: 15px;
}

.sentence span {
  display: inline-block;
  margin: 0 4px;
  padding: 2px 5px;
  border-radius: 7px;
}

.sentence span.active {
  background: #ffe39c;
}

.stat {
  padding: 18px;
  margin: 12px;
  border-radius: 15px;
  background: #eef6ff;
}

.stat strong {
  font-size: 30px;
}

.note {
  font-size: 15px;
  color: #55718b;
}

@media (max-width: 600px) {
  h1 { font-size: 29px; }
  .menu { grid-template-columns: 1fr; }
  .panel { padding: 18px 10px; }
}
</style>
</head>

<body>

<header>
  <h1>📚 Reading Adventure</h1>
  <p>Learn sounds, blend words and enjoy reading!</p>
  <div class="stars">
    ⭐ Stars: <span id="totalStars">0</span>
  </div>
</header>

<main>

<!-- HOME -->
<section id="home" class="panel">
  <h2>Welcome, Little Reader!</h2>
  <p>Choose a learning adventure.</p>

  <div class="menu">
    <button onclick="startGame('letters')">
      🔠 Find the Letter
    </button>

    <button onclick="startGame('phonics')">
      🔊 Letter Sounds
    </button>

    <button onclick="startGame('blending')">
      🎵 Sound Blending
    </button>

    <button onclick="startGame('words')">
      🧩 Build a Word
    </button>

    <button onclick="startGame('sentences')">
      📖 Read a Sentence
    </button>

    <button onclick="showJourney()">
      🏆 My Learning Journey
    </button>
  </div>

  <p>Learn at your own pace. No timers!</p>
</section>

<!-- GAME SCREEN -->
<section id="game" class="panel hidden">
  <h2 id="gameTitle"></h2>
  <p class="progress" id="gameProgress"></p>
  <p id="gameInstruction"></p>

  <div id="gameContent"></div>

  <p class="feedback" id="feedback"
     role="status" aria-live="polite"></p>

  <button id="nextButton" class="hidden"
          onclick="nextQuestion()">
    Next ➜
  </button>

  <button onclick="goHome()">🏠 Home</button>
</section>

<!-- JOURNEY -->
<section id="journey" class="panel hidden">
  <h2>🏆 My Learning Journey</h2>
  <div id="journeyStats"></div>

  <p class="note">
    Progress is stored on this device only.
  </p>

  <button onclick="goHome()">🏠 Home</button>
  <button onclick="resetProgress()">Reset Progress</button>
</section>

<!-- FINISH -->
<section id="finish" class="panel hidden">
  <h2>🎉 Adventure Complete!</h2>
  <p id="finishMessage"></p>
  <button onclick="goHome()">🏠 Home</button>
  <button onclick="startGame(currentGame)">
    Play Again
  </button>
</section>

</main>

<script>

// ===================================
// DATA AND STORAGE
// ===================================

const storageKey = "readingAdventureV4";

function defaultProgress() {
  return {
    stars: 0,
    attempts: 0,
    correct: 0,
    completed: 0
  };
}

function loadProgress() {
  try {
    const data = JSON.parse(
      localStorage.getItem(storageKey)
    );
    return data && typeof data === "object"
      ? {...defaultProgress(), ...data}
      : defaultProgress();
  } catch {
    return defaultProgress();
  }
}

let progress = loadProgress();

function saveProgress() {
  try {
    localStorage.setItem(
      storageKey,
      JSON.stringify(progress)
    );
  } catch {}

  document.getElementById("totalStars").textContent =
    progress.stars;
}

function recordAnswer(correct) {
  progress.attempts++;

  if (correct) {
    progress.correct++;
    progress.stars++;
  }

  saveProgress();
}

// ===================================
// AUDIO
// ===================================

let phonemeAudio = new Audio();
let speechToken = 0;

function stopAudio() {
  phonemeAudio.pause();
  phonemeAudio.currentTime = 0;

  speechToken++;

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
}

function speakText(text, onEnd) {
  if (!("speechSynthesis" in window)) {
    setFeedback("Speech is unavailable in this browser.");
    return;
  }

  speechSynthesis.cancel();
  const token = ++speechToken;

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "en-SG";
  utterance.rate = 0.75;
  utterance.pitch = 1;

  utterance.onend = () => {
    if (token === speechToken && onEnd) onEnd();
  };

  speechSynthesis.speak(utterance);
}

function playPhoneme(letter, onEnd) {
  phonemeAudio.pause();
  phonemeAudio = new Audio(
    "audio/" + letter + ".mp3"
  );

  phonemeAudio.onended = () => {
    if (onEnd) onEnd();
  };

  phonemeAudio.play().catch(() => {
    setFeedback(
      "Audio unavailable. Check the audio folder."
    );
  });
}

// ===================================
// GAME CONTENT
// ===================================

const letterData = [
  {answer:"m", options:["m","s","t"]},
  {answer:"s", options:["a","s","p"]},
  {answer:"t", options:["t","n","m"]},
  {answer:"a", options:["a","i","s"]},
  {answer:"p", options:["p","t","m"]}
];

const phonicsData = [
  {answer:"s", options:["s","m","t"]},
  {answer:"a", options:["a","i","p"]},
  {answer:"t", options:["t","s","n"]},
  {answer:"p", options:["p","m","a"]},
  {answer:"i", options:["i","a","n"]},
  {answer:"n", options:["n","m","t"]},
  {answer:"m", options:["m","s","p"]}
];

const blendingData = [
  {word:"sat", sounds:["s","a","t"],
   options:["sat","mat","tap"]},
  {word:"mat", sounds:["m","a","t"],
   options:["sat","mat","map"]},
  {word:"pin", sounds:["p","i","n"],
   options:["pin","pan","tin"]},
  {word:"sit", sounds:["s","i","t"],
   options:["sit","sat","sip"]}
];

const wordData = [
  {word:"sat"},
  {word:"mat"},
  {word:"pin"},
  {word:"sit"}
];

const sentenceData = [
  {
    sentence:"Sam sat.",
    question:"Who sat?",
    options:["Sam","Tom","Pat"],
    answer:"Sam"
  },
  {
    sentence:"A cat sat on a mat.",
    question:"What sat on the mat?",
    options:["A cat","A dog","A bird"],
    answer:"A cat"
  },
  {
    sentence:"The sun is hot.",
    question:"What is hot?",
    options:["The sun","The moon","The rain"],
    answer:"The sun"
  }
];

const gameInfo = {
  letters:{
    title:"🔠 Find the Letter",
    instruction:"Find the correct letter.",
    data:letterData
  },
  phonics:{
    title:"🔊 Letter Sounds",
    instruction:"Listen and choose the letter.",
    data:phonicsData
  },
  blending:{
    title:"🎵 Sound Blending",
    instruction:"Listen to the sounds. Find the word.",
    data:blendingData
  },
  words:{
    title:"🧩 Build a Word",
    instruction:"Listen and arrange the letters.",
    data:wordData
  },
  sentences:{
    title:"📖 Read a Sentence",
    instruction:"Read, listen and answer.",
    data:sentenceData
  }
};

// ===================================
// NAVIGATION
// ===================================

let currentGame = "letters";
let questionIndex = 0;
let gameScore = 0;
let answered = false;
let selectedLetters = [];
let usedTiles = [];

function showSection(id) {
  ["home","game","journey","finish"].forEach(
    section => {
      document.getElementById(section)
        .classList.toggle(
          "hidden", section !== id
        );
    }
  );

  window.scrollTo(0, 0);
}

function goHome() {
  stopAudio();
  saveProgress();
  showSection("home");
}

function startGame(game) {
  stopAudio();

  currentGame = game;
  questionIndex = 0;
  gameScore = 0;

  showSection("game");
  loadQuestion();
}

function getQuestion() {
  return gameInfo[currentGame]
    .data[questionIndex];
}

function setFeedback(message) {
  document.getElementById("feedback")
    .textContent = message;
}

function createButton(text, callback) {
  const button = document.createElement("button");
  button.textContent = text;
  button.onclick = callback;
  return button;
}

function loadQuestion() {
  stopAudio();

  answered = false;
  selectedLetters = [];
  usedTiles = [];

  const info = gameInfo[currentGame];

  document.getElementById("gameTitle")
    .textContent = info.title;

  document.getElementById("gameInstruction")
    .textContent = info.instruction;

  document.getElementById("gameProgress")
    .textContent =
    `Question ${questionIndex + 1} of ${info.data.length}`;

  document.getElementById("gameContent")
    .innerHTML = "";

  document.getElementById("nextButton")
    .classList.add("hidden");

  setFeedback("");

  if (currentGame === "letters") {
    renderLetters();
  }

  if (currentGame === "phonics") {
    renderPhonics();
  }

  if (currentGame === "blending") {
    renderBlending();
  }

  if (currentGame === "words") {
    renderWords();
  }

  if (currentGame === "sentences") {
    renderSentences();
  }
}

// ===================================
// ANSWER HANDLING
// ===================================

function submitAnswer(isCorrect, correctAnswer) {
  if (answered) return;

  answered = true;
  recordAnswer(isCorrect);

  if (isCorrect) gameScore++;

  setFeedback(
    isCorrect
      ? "⭐ Wonderful! Great job!"
      : "Good try! The answer is " + correctAnswer + "."
  );

  document.getElementById("nextButton")
    .classList.remove("hidden");
}

function nextQuestion() {
  stopAudio();
  questionIndex++;

  if (
    questionIndex <
    gameInfo[currentGame].data.length
  ) {
    loadQuestion();
  } else {
    progress.completed++;
    saveProgress();

    document.getElementById("finishMessage")
      .textContent =
      `You got ${gameScore} out of ${
        gameInfo[currentGame].data.length
      } correct!`;

    showSection("finish");
  }
}

// ===================================
// GAME 1: FIND THE LETTER
// ===================================

function renderLetters() {
  const q = getQuestion();
  const area = document.getElementById("gameContent");

  const heading = document.createElement("h2");
  heading.textContent = "Find the letter " + q.answer;
  area.appendChild(heading);

  q.options.forEach(letter => {
    area.appendChild(
      createButton(letter, () => {
        submitAnswer(
          letter === q.answer,
          q.answer
        );
      })
    );
  });
}

// ===================================
// GAME 2: LETTER SOUNDS
// ===================================

function renderPhonics() {
  const q = getQuestion();
  const area = document.getElementById("gameContent");

  area.appendChild(
    createButton("🔊 Hear the Sound", () => {
      playPhoneme(q.answer);
    })
  );

  const options = document.createElement("div");
  options.className = "options";

  q.options.forEach(letter => {
    options.appendChild(
      createButton(letter, () => {
        submitAnswer(
          letter === q.answer,
          q.answer
        );
      })
    );
  });

  area.appendChild(options);
}

// ===================================
// GAME 3: SOUND BLENDING
// ===================================

function playSoundSequence(sounds) {
  stopAudio();

  let position = 0;

  function nextSound() {
    if (position >= sounds.length) return;

    const letter = sounds[position];
    position++;

    playPhoneme(letter, () => {
      setTimeout(nextSound, 350);
    });
  }

  nextSound();
}

function renderBlending() {
  const q = getQuestion();
  const area = document.getElementById("gameContent");

  area.appendChild(
    createButton("🔊 Hear Each Sound", () => {
      playSoundSequence(q.sounds);
    })
  );

  area.appendChild(
    createButton("🔊 Hear the Whole Word", () => {
      stopAudio();
      speakText(q.word);
    })
  );

  const options = document.createElement("div");
  options.className = "options";

  q.options.forEach(word => {
    options.appendChild(
      createButton(word, () => {
        submitAnswer(
          word === q.word,
          q.word
        );
      })
    );
  });

  area.appendChild(options);
}

// ===================================
// GAME 4: BUILD A WORD
// ===================================

function renderWords() {
  const q = getQuestion();
  const area = document.getElementById("gameContent");

  area.appendChild(
    createButton("🔊 Hear the Word", () => {
      speakText(q.word);
    })
  );

  const answerBox = document.createElement("div");
  answerBox.className = "word-box";
  answerBox.id = "answerBox";
  area.appendChild(answerBox);

  const tileBox = document.createElement("div");
  tileBox.className = "options";
  tileBox.id = "tileBox";
  area.appendChild(tileBox);

  const retry = createButton(
    "↩ Clear Letters",
    () => {
      if (answered) return;
      selectedLetters = [];
      usedTiles = [];
      updateWordTiles();
    }
  );

  area.appendChild(retry);
  updateWordTiles();
}

function updateWordTiles() {
  const q = getQuestion();

  const answerBox =
    document.getElementById("answerBox");

  const tileBox =
    document.getElementById("tileBox");

  answerBox.innerHTML = "";
  tileBox.innerHTML = "";

  for (let i = 0; i < q.word.length; i++) {
    const tile = document.createElement("span");
    tile.className = "tile";
    tile.textContent = selectedLetters[i] || "_";
    answerBox.appendChild(tile);
  }

  const letters = q.word.split("").reverse();

  letters.forEach((letter, index) => {
    const button = createButton(letter, () => {
      if (answered || usedTiles.includes(index)) {
        return;
      }

      usedTiles.push(index);
      selectedLetters.push(letter);

      updateWordTiles();

      if (selectedLetters.length === q.word.length) {
        const answer = selectedLetters.join("");

        submitAnswer(
          answer === q.word,
          q.word
        );
      }
    });

    button.disabled =
      answered || usedTiles.includes(index);

    tileBox.appendChild(button);
  });
}

// ===================================
// GAME 5: READ A SENTENCE
// ===================================

function renderSentences() {
  const q = getQuestion();
  const area = document.getElementById("gameContent");

  const sentenceBox = document.createElement("div");
  sentenceBox.className = "sentence";
  sentenceBox.id = "sentenceBox";

  const words = q.sentence.split(" ");

  words.forEach((word, index) => {
    const span = document.createElement("span");
    span.textContent = word;
    span.id = "spokenWord" + index;
    sentenceBox.appendChild(span);
  });

  area.appendChild(sentenceBox);

  area.appendChild(
    createButton("🔊 Read with Me", () => {
      readSentenceWithHighlight(words);
    })
  );

  const heading = document.createElement("h3");
  heading.textContent = q.question;
  area.appendChild(heading);

  const options = document.createElement("div");
  options.className = "options";

  q.options.forEach(answer => {
    options.appendChild(
      createButton(answer, () => {
        submitAnswer(
          answer === q.answer,
          q.answer
        );
      })
    );
  });

  area.appendChild(options);
}

function readSentenceWithHighlight(words) {
  stopAudio();

  let index = 0;

  function readNext() {
    if (index >= words.length) return;

    document.querySelectorAll(
      ".sentence span"
    ).forEach(span => {
      span.classList.remove("active");
    });

    const span = document.getElementById(
      "spokenWord" + index
    );

    if (span) span.classList.add("active");

    const word = words[index];
    index++;

    speakText(word, () => {
      readNext();
    });
  }

  readNext();
}

// ===================================
// LEARNING JOURNEY
// ===================================

function showJourney() {
  stopAudio();

  const accuracy = progress.attempts
    ? Math.round(
        progress.correct /
        progress.attempts * 100
      )
    : 0;

  const area = document.getElementById(
    "journeyStats"
  );

  area.innerHTML = "";

  const stats = [
    ["⭐ Total Stars", progress.stars],
    ["🎮 Questions Attempted", progress.attempts],
    ["✅ Correct Answers", progress.correct],
    ["📊 Accuracy", accuracy + "%"],
    ["🎉 Completed Games", progress.completed]
  ];

  stats.forEach(([label, value]) => {
    const box = document.createElement("div");
    box.className = "stat";

    const title = document.createElement("div");
    title.textContent = label;

    const number = document.createElement("strong");
    number.textContent = value;

    box.appendChild(title);
    box.appendChild(number);
    area.appendChild(box);
  });

  showSection("journey");
}

function resetProgress() {
  if (!confirm("Reset all learning progress?")) {
    return;
  }

  progress = defaultProgress();
  saveProgress();
  showJourney();
}

// ===================================
// START
// ===================================

saveProgress();
goHome();

</script>
</body>
</html>
